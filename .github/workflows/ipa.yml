
name: Build XA IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project XA.xcodeproj \
            -scheme XA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/XA.app ipa/Payload/
          cd ipa
          ditto -c -k --sequesterRsrc --keepParent Payload XA.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XA-unsigned-IPA
          path: ipa/XA.ipa
          if-no-files-found: error
          retention-days: 7
